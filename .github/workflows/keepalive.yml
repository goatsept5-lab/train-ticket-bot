name: GitHub Actions Keepalive

# GitHub suspends scheduled cron workflows if a repository has no commit
# activity for 60 consecutive days. This workflow runs automatically every
# 15 days (1st & 15th of every month) to commit a timestamp heartbeat,
# ensuring the train ticket watcher stays alive indefinitely.

on:
  schedule:
    # Runs at 00:00 UTC on the 1st and 15th of every month
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    name: Keep Repository Active
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update keepalive heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          date -u +"Last keepalive heartbeat: %Y-%m-%d %H:%M:%S UTC" > .github/keepalive.txt
          git add .github/keepalive.txt
          git commit -m "chore(keepalive): automated repository heartbeat [skip ci]" || exit 0
          git push
